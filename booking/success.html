<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم تأكيد الحجز | Yassin Hassan</title>
  <link rel="stylesheet" href="booking.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="../index.html">Yassin Hassan</a>
    <a class="back-link" href="../index.html">الرئيسية</a>
  </div>
</header>

<main class="container booking-page">

  <section class="booking-card" id="success-card">
    <div class="booking-hero">
      <span class="eyebrow">Booking Confirmed</span>
      <h1>تم تأكيد الحجز بنجاح</h1>
      <p>تم حفظ بيانات الموعد في Demo الخاص بالنظام.</p>
    </div>

    <div id="booking-details" class="summary"></div>

    <div class="demo-notice">
      <strong>Demo Mode</strong>
      <span>لم يتم إرسال إشعار خارجي بعد. سيتم ربط Telegram في مرحلة التطوير التالية.</span>
    </div>

    <div class="step-actions">
      <a class="btn secondary" href="index.html">حجز موعد آخر</a>
      <a class="btn primary" href="../index.html">العودة للموقع</a>
    </div>
  </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const booking = JSON.parse(
    localStorage.getItem("tradeSphareLastBooking") || "null"
  );

  const container = document.getElementById("booking-details");

  if (!booking) {
    container.innerHTML = "<p>لم يتم العثور على بيانات الحجز.</p>";
    return;
  }

  const rows = [
    ["رقم الحجز", booking.id],
    ["الخدمة", booking.serviceName],
    ["نوع الاجتماع", booking.meetingName],
    ["المدة", `${booking.duration} دقيقة`],
    ["التاريخ", booking.date],
    ["الوقت", booking.time],
    ["الاسم", booking.name],
    ["البريد الإلكتروني", booking.email],
    ["الحالة", "قيد الانتظار"]
  ];

  container.innerHTML = rows.map(([label, value]) => `
    <div class="summary-row">
      <span>${escapeHtml(label)}</span>
      <strong>${escapeHtml(value)}</strong>
    </div>
  `).join("");
});

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
