<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Demo | Yassin Hassan</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="admin-header">
  <div class="container header-inner">
    <div>
      <strong>Yassin Hassan</strong>
      <span>Booking Admin Demo</span>
    </div>

    <a href="../index.html">الموقع الرئيسي</a>
  </div>
</header>

<main class="container admin-page">

  <section class="page-heading">
    <div>
      <span class="eyebrow">ADMIN DEMO</span>
      <h1>لوحة إدارة الحجوزات</h1>
      <p>لوحة تجريبية تعمل باستخدام LocalStorage فقط.</p>
    </div>

    <button class="btn danger" id="clear-all">حذف جميع الحجوزات</button>
  </section>

  <section class="stats-grid">
    <div class="stat-card">
      <span>كل الحجوزات</span>
      <strong id="stat-total">0</strong>
    </div>

    <div class="stat-card">
      <span>قيد الانتظار</span>
      <strong id="stat-pending">0</strong>
    </div>

    <div class="stat-card">
      <span>مؤكدة</span>
      <strong id="stat-confirmed">0</strong>
    </div>

    <div class="stat-card">
      <span>ملغاة</span>
      <strong id="stat-cancelled">0</strong>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>الحجوزات</h2>

      <div class="filters">
        <select id="status-filter">
          <option value="">كل الحالات</option>
          <option value="pending">قيد الانتظار</option>
          <option value="confirmed">مؤكد</option>
          <option value="completed">مكتمل</option>
          <option value="cancelled">ملغى</option>
        </select>

        <input type="date" id="date-filter">
      </div>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>رقم الحجز</th>
            <th>العميل</th>
            <th>الخدمة</th>
            <th>الموعد</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>

        <tbody id="bookings-table"></tbody>
      </table>
    </div>

    <div id="empty-state" class="empty-state" hidden>
      لا توجد حجوزات مطابقة.
    </div>
  </section>

</main>

<script src="admin.js"></script>
</body>
</html>
